# ---------------------------------------------------------- PLANTED ERRORS
# Applied on top of clean invoices. Toggle `enabled` to test a clean baseline.
errors:
  - id: E1a
    enabled: true
    contractor: PCS
    week: W1
    description: Standby day billed at full pump rate (repeat pattern)
    mutation: {line: PCS-EQ-PU, billed_qty: 4, billed_rate: 40000}
    rule: site_record_match
    flagged_php: 40000          # 1 day with 0 equipment hours x 40,000
    decision: correct
    correct_php: 20000          # 50% standby per 4.2
    overbilled_php: 20000
    evidence: {clauses: ["4.2"], records: ["equipment_log PU-101 2026-09-03", "daily_report 2026-09-03"]}

  - id: E1b
    enabled: true
    contractor: PCS
    week: W2
    description: "HEADLINE: 2 standby days billed at full pump rate"
    mutation: {line: PCS-EQ-PU, billed_qty: 5, billed_rate: 40000}
    rule: site_record_match
    flagged_php: 80000
    decision: correct
    correct_php: 40000
    overbilled_php: 40000
    evidence: {clauses: ["4.2"], records: ["equipment_log PU-101 2026-09-10..11", "gate_log PCS crew 2026-09-07..09", "daily_report 2026-09-10..11"]}
    # Invoice total check: 200,000 pump + 168,000 crew + 132,000 proppant = 500,000

  - id: E2
    enabled: true
