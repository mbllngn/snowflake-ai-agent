# ---------------------------------------------------------------- CONTRACT
contract:
  title: Master Service Agreement No. PUP-MSA-2026-014
  effective: 2026-01-01
  expiry: 2026-12-31
  clauses:
    "2.1": {title: Term, text: "Agreement runs from Effective Date to Expiry unless a Contractor Schedule states a shorter term. Charges for work outside the applicable term are not payable."}
    "4.1": {title: Rates, text: "Work is billed at the rates in Exhibit A. Rates include fuel, consumables, and contractor overhead unless Exhibit A lists an item separately."}
    "4.2": {title: Standby, text: "Equipment left on location but idle due to weather or Company instruction is billable at 50% of its day rate. Personnel stood down off location are not billable."}
    "4.3": {title: Minimum Charge, text: "Crane call-outs carry a one-day minimum per mobilization."}
    "5.1": {title: Field Tickets, text: "Every charge must be supported by a field ticket signed by the Company Representative. Unsigned tickets are not payable until signed."}
    "5.4": {title: Travel Time, text: "Personnel travel between contractor base and location is billable at standard hourly rates, capped at 2 hours each way per day."}
    "6.1": {title: Invoicing, text: "Contractor invoices weekly. A field ticket may be billed only once; resubmitted tickets are not payable."}
    "7.3": {title: Exclusions, text: "The following are not billable: fuel surcharges, mobilization/demobilization unless pre-approved in writing, and meals for contractor personnel housed at Company camp."}

